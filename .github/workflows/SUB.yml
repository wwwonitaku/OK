name: Translate VTT AI (With Auto Retry)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug"
        required: true
        type: string

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install webvtt-py google-genai requests

      - name: Translate and Upload
        env:
          SLUG: ${{ github.event.inputs.slug }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          cat > translate.py << 'PYTHON'
          import os
          import re
          import time
          import random
          import requests
          import webvtt
          from google import genai
          from google.genai import types

          slug = os.environ["SLUG"]

          # ============================================================
          # ĐỌC NHIỀU API KEY (mỗi dòng 1 key)
          # ============================================================
          raw_keys = os.environ.get("GEMINI_API_KEYS", "")
          api_keys = [k.strip() for k in raw_keys.strip().splitlines() if k.strip()]

          if not api_keys:
              raise Exception("LỖI: Vui lòng cấu hình GEMINI_API_KEYS trong GitHub Secrets trước khi chạy!")

          def get_random_client():
              key = random.choice(api_keys)
              return genai.Client(api_key=key)

          SOURCE_URL = f"https://vicdn.cc/vtt/{slug}.vtt"

          if "-" in slug:
              base_slug = "-".join(slug.split("-")[:-1])
              output_slug = f"{base_slug}-vi"
          else:
              output_slug = f"{slug}-vi"

          OUTPUT_FILE = f"{output_slug}.vtt"
          UPLOAD_URL = "https://vicdn.cc/sub.php"

          MAX_LINE_LENGTH = 80

          # ============================================================
          # LOGGING HELPER
          # ============================================================
          def log_separator(char="=", length=60):
              print(char * length, flush=True)

          def log_section(title):
              log_separator()
              print(f"  {title}", flush=True)
              log_separator()

          def log(msg):
              print(msg, flush=True)

          # ============================================================
          # HÀM TIỀN XỬ LÝ SUB
          # ============================================================
          EMOTION_PATTERN = re.compile(r'\[([^\]]*)\]')

          def is_emotion_only(text):
              stripped = EMOTION_PATTERN.sub('', text).strip()
              return stripped == ''

          def clean_caption_text(text):
              cleaned = EMOTION_PATTERN.sub('', text).strip()
              cleaned = re.sub(r'  +', ' ', cleaned)
              return cleaned

          def wrap_long_line(text, max_len=MAX_LINE_LENGTH):
              if len(text) <= max_len:
                  return text
              mid = len(text) // 2
              best_pos = -1
              for i in range(mid, len(text)):
                  if text[i] in (' ', ',', '.', '!', '?', ';', ':'):
                      best_pos = i
                      break
              if best_pos == -1:
                  for i in range(mid, -1, -1):
                      if text[i] in (' ', ',', '.', '!', '?', ';', ':'):
                          best_pos = i
                          break
              if best_pos == -1:
                  best_pos = mid
              line1 = text[:best_pos].rstrip()
              line2 = text[best_pos:].lstrip()
              return f"{line1}\n{line2}"

          def preprocess_captions(captions):
              valid = []
              removed = 0
              for cap in captions:
                  original = cap.text.replace("\n", " ").strip()
                  if is_emotion_only(original):
                      removed += 1
                      continue
                  cleaned = clean_caption_text(original)
                  if not cleaned:
                      removed += 1
                      continue
                  cleaned = wrap_long_line(cleaned)
                  cap.text = cleaned
                  valid.append(cap)
              log(f"Tiền xử lý: Đã loại bỏ {removed} dòng chỉ chứa cảm xúc/trống. Còn lại {len(valid)} dòng.")
              return valid

          # ============================================================
          # HÀM PARSE KẾT QUẢ AI
          # ============================================================
          def parse_translated(response_text):
              translated_dict = {}
              for line in response_text.strip().split('\n'):
                  if ']' in line:
                      try:
                          parts = line.split(']', 1)
                          idx_str = parts[0].replace('[', '').strip()
                          val = parts[1].strip()
                          if val == "...":
                              val = ""
                          translated_dict[int(idx_str)] = val
                      except Exception:
                          pass
              return translated_dict

          # ============================================================
          # HÀM GỌI API VỚI RETRY (có rotate key)
          # ============================================================
          def call_api_with_retry(prompt_text, system_instruction, max_retries=10):
              for attempt in range(max_retries):
                  wait = 6 * (2 ** attempt)
                  client = get_random_client()
                  log(f">> GỬI API — Lần thử {attempt + 1}/{max_retries} | Key #{api_keys.index(client._api_key) + 1 if hasattr(client, '_api_key') else '?'} | {time.strftime('%H:%M:%S')}")
                  try:
                      t_start = time.time()
                      response = client.models.generate_content(
                          model='gemini-2.5-flash',
                          contents=prompt_text,
                          config=types.GenerateContentConfig(
                              system_instruction=system_instruction,
                              temperature=0.3,
                          )
                      )
                      elapsed = time.time() - t_start
                      log(f"<< NHẬN KẾT QUẢ — Thành công sau {elapsed:.1f}s")
                      return response.text
                  except Exception as e:
                      error_str = str(e)
                      log(f"<< LỖI API: {error_str}")
                      if "503" in error_str or "429" in error_str or "UNAVAILABLE" in error_str or "500" in error_str:
                          log(f"   Server bận/quá tải/limit. Đổi key và chờ {wait}s...")
                          time.sleep(wait)
                      else:
                          log(f"   Lỗi không thể retry. Dừng thử lại.")
                          break
              return None

          # ============================================================
          # BẮT ĐẦU CHÍNH
          # ============================================================
          log_section("BẮT ĐẦU QUÁ TRÌNH DỊCH PHỤ ĐỀ AI")
          log(f"Slug       : {slug}")
          log(f"Source URL : {SOURCE_URL}")
          log(f"Output file: {OUTPUT_FILE}")
          log(f"Số API key : {len(api_keys)}")

          r = requests.get(SOURCE_URL, timeout=60)
          if r.status_code != 200:
              raise Exception(f"Không thể tải file sub gốc. HTTP Status: {r.status_code}")

          with open("input.vtt", "wb") as f:
              f.write(r.content)
          log("Tải sub gốc thành công!")

          vtt = webvtt.read("input.vtt")
          captions = list(vtt)
          log(f"Tổng số dòng gốc: {len(captions)}")

          captions = preprocess_captions(captions)
          total_lines = len(captions)

          BATCH_SIZE = 100
          total_batches = (total_lines + BATCH_SIZE - 1) // BATCH_SIZE

          log_section(f"BẮT ĐẦU DỊCH — {total_lines} dòng / {total_batches} batch")

          system_instruction = (
              "You are a professional movie subtitle translator. Translate the text into natural, fluent Vietnamese.\n"
              "CRITICAL RULES:\n"
              "1. You MUST output EVERY line with its exact index. Never skip any index.\n"
              "2. Maintain the exact same line identifiers like [0], [1], [2], etc. Do not merge, skip, or group any lines.\n"
              "3. If a line is empty or just '...', output the identifier with '...'.\n"
              "4. Translate naturally based on the surrounding context (character relationships, movie tone).\n"
              "5. Output ONLY the translated numbered lines. No markdown, no notes, no extra text."
          )

          for i in range(0, total_lines, BATCH_SIZE):
              batch = captions[i:i + BATCH_SIZE]
              batch_num = (i // BATCH_SIZE) + 1
              line_start = i + 1
              line_end = min(i + BATCH_SIZE, total_lines)

              log_separator("-")
              log(f"[BATCH {batch_num}/{total_batches}] Dòng {line_start}–{line_end} ({len(batch)} dòng)")
              log_separator("-")

              # Build prompt
              prompt_text = ""
              for idx, cap in enumerate(batch):
                  clean_text = cap.text.replace("\n", " ").strip()
                  if not clean_text:
                      clean_text = "..."
                  prompt_text += f"[{idx}] {clean_text}\n"

              log(">> NỘI DUNG GỬI LÊN API:")
              for line in prompt_text.strip().split('\n'):
                  log(f"   {line}")

              # Lần thử đầu
              response_text = call_api_with_retry(prompt_text, system_instruction)
              if response_text is None:
                  raise Exception(f"[THẤT BẠI] Không thể dịch batch {batch_num} sau nhiều lần thử.")

              log(">> KẾT QUẢ DỊCH TỪ AI:")
              for line in response_text.strip().split('\n'):
                  log(f"   {line}")

              translated_dict = parse_translated(response_text)

              # Kiểm tra xem có dòng nào bị thiếu không
              missing_indices = [idx for idx in range(len(batch)) if idx not in translated_dict or not translated_dict.get(idx)]
              if missing_indices:
                  log(f">> CẢNH BÁO: AI bỏ sót {len(missing_indices)} dòng: {missing_indices}. Retry với prompt nhắc rõ hơn...")

                  # Tạo prompt retry chỉ cho các dòng bị thiếu
                  retry_prompt = f"You missed some lines in your previous translation. Please translate ONLY these missing lines:\n\n"
                  for idx in missing_indices:
                      clean_text = batch[idx].text.replace("\n", " ").strip() or "..."
                      retry_prompt += f"[{idx}] {clean_text}\n"
                  retry_prompt += f"\nOutput ONLY the missing lines with their exact [index] prefix."

                  retry_response = call_api_with_retry(retry_prompt, system_instruction)
                  if retry_response:
                      log(">> KẾT QUẢ RETRY:")
                      for line in retry_response.strip().split('\n'):
                          log(f"   {line}")
                      retry_dict = parse_translated(retry_response)
                      translated_dict.update(retry_dict)

              # Mapping kết quả vào caption
              log(">> MAPPING KẾT QUẢ VÀO TIMELINE:")
              fallback_count = 0
              for idx, cap in enumerate(batch):
                  abs_line = i + idx + 1
                  if idx in translated_dict and translated_dict[idx]:
                      translated_vi = wrap_long_line(translated_dict[idx])
                      log(f"   [{abs_line:04d}] {cap.text.replace(chr(10), ' ')!r:45s} → {translated_vi.replace(chr(10), ' ')!r}")
                      cap.text = translated_vi
                  else:
                      # Fallback: giữ nguyên text gốc, không crash
                      log(f"   [{abs_line:04d}] ⚠ FALLBACK (giữ nguyên gốc): {cap.text.replace(chr(10), ' ')!r}")
                      fallback_count += 1

              if fallback_count > 0:
                  log(f">> ⚠ Batch {batch_num}: {fallback_count} dòng giữ nguyên tiếng Anh do AI bỏ sót.")

              log(f"[BATCH {batch_num}/{total_batches}] Hoàn thành ✓")
              log(f"Chờ 3s trước batch tiếp theo...")
              time.sleep(3)

          log_section("LƯU FILE VÀ UPLOAD")
          vtt.save(OUTPUT_FILE)
          log(f"Đã lưu file: {OUTPUT_FILE}")

          log("Đang upload lên server...")
          with open(OUTPUT_FILE, "rb") as f:
              files = {"file": (OUTPUT_FILE, f, "text/vtt")}
              data = {"filename": OUTPUT_FILE}
              upload = requests.post(UPLOAD_URL, files=files, data=data, timeout=120)

          log(f"Trạng thái Upload : {upload.status_code}")
          log(f"Phản hồi từ Server: {upload.text}")

          if upload.status_code != 200:
              raise Exception("Quá trình Upload lên server thất bại!")

          log_section("HOÀN THÀNH")
          PYTHON
          python translate.py
